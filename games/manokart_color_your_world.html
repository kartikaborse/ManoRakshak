<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ManoRakshak.AI — Color Your World</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,400&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0c0e0b;
      --surface: #141710;
      --border: rgba(255, 255, 255, .07);
      --text: #e8ede4;
      --muted: #7a8a74;
      --accent: #a8e063;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden
    }

    /* ── TOP BAR ── */
    .gbar {
      background: rgba(12, 14, 11, .82);
      border-bottom: 1px solid var(--border);
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px)
    }

    .gbar a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: color .2s
    }

    .gbar a:hover {
      color: var(--accent)
    }

    .gbar .t {
      flex: 1;
      font-weight: 600;
      font-size: 15px;
      text-align: center;
      letter-spacing: .01em
    }

    .gbar .xb {
      font-size: 11px;
      color: var(--accent);
      background: rgba(168, 224, 99, .1);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: .04em
    }

    /* ── LAYOUT ── */
    #g {
      padding: 22px 18px 40px;
      max-width: 660px;
      margin: 0 auto
    }

    /* ── HERO HEADER ── */
    .hero {
      margin-bottom: 22px;
      position: relative
    }

    .hero-eyebrow {
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 10px
    }

    .hero-title em {
      font-style: italic;
      color: var(--accent)
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, .06);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
      margin-bottom: 6px
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #a8e063, #4FC3F7, #F48FB1);
      transition: width .8s cubic-bezier(.4, 0, .2, 1)
    }

    .hero-sub {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between
    }

    /* ── CANVAS WORLD ── */
    .world-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .03) inset
    }

    canvas#world {
      display: block;
      width: 100%
    }

    .world-label {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .25)
    }

    /* ── COLOR PALETTE ── */
    .section-label {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .pal-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      align-items: center
    }

    .cs {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all .2s;
      flex-shrink: 0;
      position: relative
    }

    .cs.unlocked {
      border-color: transparent
    }

    .cs.locked {
      filter: grayscale(1);
      opacity: .28;
      cursor: not-allowed
    }

    .cs.selected {
      border-color: #fff;
      transform: scale(1.22);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .15)
    }

    .cs:not(.locked):hover {
      transform: scale(1.1)
    }

    .cs .lock-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0
    }

    .cs.locked .lock-icon {
      opacity: 1
    }

    .cs-tooltip {
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 9, .92);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 20
    }

    .cs:hover .cs-tooltip {
      opacity: 1
    }

    /* ── MOMENT CARDS ── */
    .moments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
      margin-bottom: 24px
    }

    .mc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .mc::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .04) 0%, transparent 60%);
      pointer-events: none
    }

    .mc:hover:not(.done) {
      border-color: rgba(255, 255, 255, .18);
      background: rgba(255, 255, 255, .05);
      transform: translateY(-2px)
    }

    .mc.done {
      opacity: .55;
      cursor: default;
      border-color: transparent
    }

    .mc.done::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 13px;
      color: var(--accent);
      font-weight: 700
    }

    .mc-icon {
      font-size: 24px;
      margin-bottom: 7px;
      display: block;
      line-height: 1
    }

    .mc-name {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text)
    }

    .mc-reward {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.3
    }

    .mc.done .mc-reward {
      color: var(--accent);
      font-weight: 500
    }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: 2px 2px 0 0
    }

    .stat-card:nth-child(1)::before {
      background: linear-gradient(90deg, #FDD835, #FF8A65)
    }

    .stat-card:nth-child(2)::before {
      background: linear-gradient(90deg, #4FC3F7, #CE93D8)
    }

    .stat-card:nth-child(3)::before {
      background: linear-gradient(90deg, #81C784, #4DB6AC)
    }

    .stat-val {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 4px
    }

    .stat-lab {
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted)
    }

    /* ── SAVE BUTTON ── */
    .svb {
      text-align: center;
      margin-top: 4px
    }

    .svb button {
      padding: 13px 32px;
      border-radius: 99px;
      border: none;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #a8e063, #4ade80);
      color: #0a0f0d;
      transition: all .2s;
      letter-spacing: .02em;
      box-shadow: 0 4px 20px rgba(168, 224, 99, .25)
    }

    .svb button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(168, 224, 99, .35)
    }

    /* ── TOAST ── */
    .tst {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(10, 14, 9, .96);
      border: 1px solid rgba(168, 224, 99, .35);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 99px;
      font-size: .83rem;
      z-index: 999;
      transition: transform .4s cubic-bezier(.34, 1.56, .64, 1);
      white-space: nowrap;
      backdrop-filter: blur(12px)
    }

    .tst.show {
      transform: translateX(-50%) translateY(0)
    }

    /* ── COLOR BURST ANIMATION ── */
    @keyframes burst {
      0% {
        transform: scale(0);
        opacity: 1
      }

      100% {
        transform: scale(3.5);
        opacity: 0
      }
    }

    .burst {
      position: fixed;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      pointer-events: none;
      animation: burst .6s ease-out forwards;
      z-index: 500
    }
    @media(max-width:480px){
      #g{padding:12px 10px}
      .stats-row{grid-template-columns:1fr;gap:10px}
      .moments-grid{grid-template-columns:repeat(2,1fr);gap:8px}
      .pal-row{justify-content:center}
    }
  </style>
</head>

<body>
  <div class="gbar">
    <a href="manokart_games_hub.html">← Hub</a>
    <div class="t">🎨 Color Your World</div>
    <div class="xb" id="lxp">0 XP</div>
  </div>

  <div id="g">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-eyebrow">Week 1 · Daily wellness</div>
      <div class="hero-title">Paint your <em>world</em> with moments</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="pbar" style="width:0%"></div>
      </div>
      <div class="hero-sub"><span id="pct">0</span>% colored<span>Complete moments to fill the canvas</span></div>
    </div>

    <!-- World canvas -->
    <div class="world-wrap">
      <canvas id="world" height="200"></canvas>
      <div class="world-label">Your world</div>
    </div>

    <!-- Palette -->
    <div class="section-label">Your colors</div>
    <div class="pal-row" id="pal"></div>

    <!-- Moments -->
    <div class="section-label">Today's wellness moments</div>
    <div class="moments-grid" id="mom"></div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="cu">0</div>
        <div class="stat-lab">Colors unlocked</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="md">0</div>
        <div class="stat-lab">Moments done</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sk">0</div>
        <div class="stat-lab">Day streak</div>
      </div>
    </div>

    <div class="svb" id="svb" style="display:none">
      <button onclick="saveAndExit()">💾 Save Score & Exit</button>
    </div>
  </div>

  <div class="tst" id="tst"></div>

  <script src="gameEngine.js"></script>
  <script>
    // ── DATA — all moments start undone (BUG FIX) ──
    const CL = [
      { name: 'Joy yellow', hex: '#FDD835', unlocked: true },
      { name: 'Calm blue', hex: '#4FC3F7', unlocked: true },
      { name: 'Love pink', hex: '#F48FB1', unlocked: true },
      { name: 'Hope green', hex: '#81C784', unlocked: false, ua: 4 },
      { name: 'Wonder purple', hex: '#CE93D8', unlocked: false, ua: 6 },
      { name: 'Passion coral', hex: '#FF8A65', unlocked: false, ua: 8 },
      { name: 'Peace teal', hex: '#4DB6AC', unlocked: false, ua: 10 }
    ];

    const MO = [
      { icon: '🌅', name: 'Morning stretch', reward: 'Calm blue boost', done: false, ci: 1 },
      { icon: '💧', name: 'Drink water', reward: 'Adds 5% color', done: false, ci: 0 },
      { icon: '📓', name: 'Journal 3 lines', reward: 'Joy yellow', done: false, ci: 0 },
      { icon: '🚶', name: '10-min walk', reward: 'Hope green unlock', done: false, ci: 3 },
      { icon: '🧘', name: 'Breathing exercise', reward: 'Adds 10% color', done: false, ci: 1 },
      { icon: '🌿', name: 'Touch nature', reward: 'Wonder purple unlock', done: false, ci: 4 },
      { icon: '😴', name: 'Sleep by 11pm', reward: 'Peace teal unlock', done: false, ci: 6 },
      { icon: '🤝', name: 'Connect with someone', reward: 'Love pink', done: false, ci: 2 }
    ];

    let sc2 = 0, md2 = 0, cu2 = 3, sk2 = 0, pts = [];

    // ── CANVAS ──
    function ip() {
      const c = document.getElementById('world');
      const w = c.parentElement.clientWidth || 620;
      c.width = w; c.height = 200; pts = [];
      for (let i = 0; i < 55; i++) {
        pts.push({
          x: Math.random() * w, y: Math.random() * 200,
          r: Math.random() * 55 + 22,
          ci: Math.floor(Math.random() * 3),
          filled: false
        });
      }
      dw();
    }

    function dw() {
      const c = document.getElementById('world'), ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      // Deep background with subtle gradient
      const bg = ctx.createLinearGradient(0, 0, c.width, c.height);
      bg.addColorStop(0, '#111410'); bg.addColorStop(1, '#0d100c');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);

      // Dot grid texture
      for (let i = 12; i < c.width; i += 20)for (let j = 12; j < c.height; j += 20) {
        ctx.fillStyle = 'rgba(255,255,255,.03)';
        ctx.beginPath(); ctx.arc(i, j, 1, 0, Math.PI * 2); ctx.fill();
      }

      // Paint blobs with soft glow
      pts.forEach(p => {
        if (!p.filled) return;
        const col = CL[p.ci].hex;
        // Outer glow
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 1.6);
        grd.addColorStop(0, col + '55'); grd.addColorStop(1, col + '00');
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.6, 0, Math.PI * 2); ctx.fill();
        // Core blob
        const core = ctx.createRadialGradient(p.x - p.r * .2, p.y - p.r * .2, 0, p.x, p.y, p.r);
        core.addColorStop(0, col + 'cc'); core.addColorStop(1, col + '66');
        ctx.fillStyle = core; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });

      const pc = Math.round(pts.filter(p => p.filled).length / pts.length * 100);
      document.getElementById('pct').textContent = pc;
      document.getElementById('pbar').style.width = pc + '%';
    }

    // ── TOAST ──
    function ts(msg) {
      const t = document.getElementById('tst');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ── COLOR BURST FX ──
    function burst(el, hex) {
      const b = document.createElement('div');
      const r = el.getBoundingClientRect();
      b.className = 'burst';
      b.style.cssText = `left:${r.left + r.width / 2 - 20}px;top:${r.top + window.scrollY + r.height / 2 - 20}px;background:${hex}55;border:2px solid ${hex}99`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 700);
    }

    // ── RENDER PALETTE ──
    function rp2() {
      const p = document.getElementById('pal'); p.innerHTML = '';
      CL.forEach((c, i) => {
        const d = document.createElement('div');
        d.className = 'cs' + (c.unlocked ? ' unlocked' : ' locked') + (i === sc2 && c.unlocked ? ' selected' : '');
        d.style.background = c.unlocked ? c.hex : '#2a2e27';
        const tip = document.createElement('div');
        tip.className = 'cs-tooltip';
        tip.textContent = c.unlocked ? c.name : `Unlock at ${c.ua} moments`;
        const lk = document.createElement('span');
        lk.className = 'lock-icon'; lk.textContent = '🔒';
        d.appendChild(lk); d.appendChild(tip);
        if (c.unlocked) d.onclick = () => { sc2 = i; rp2(); };
        p.appendChild(d);
      });
    }

    // ── RENDER MOMENTS ──
    function rm() {
      const g = document.getElementById('mom'); g.innerHTML = '';
      MO.forEach((m, i) => {
        const d = document.createElement('div');
        d.className = 'mc' + (m.done ? ' done' : '');
        d.innerHTML = `<span class="mc-icon">${m.icon}</span><div class="mc-name">${m.name}</div><div class="mc-reward">${m.done ? 'Done!' : m.reward}</div>`;
        if (!m.done) d.onclick = () => cm(i, d);
        g.appendChild(d);
      });
    }

    // ── COMPLETE MOMENT ──
    function cm(i, el) {
      MO[i].done = true;
      md2++; sk2++;

      const ci = MO[i].ci;
      // Unlock color if threshold met
      if (!CL[ci].unlocked && md2 >= CL[ci].ua) {
        CL[ci].unlocked = true; cu2++;
        ts(`🎨 New color unlocked: ${CL[ci].name}!`);
      } else {
        ts(`✨ ${MO[i].name} complete!`);
      }

      // Add a paint blob
      const np = Math.floor(Math.random() * pts.length);
      // Find first unfilled or random
      const unfilled = pts.filter(p => !p.filled);
      const target = unfilled.length ? unfilled[Math.floor(Math.random() * unfilled.length)] : pts[np];
      target.filled = true; target.ci = ci < CL.length ? ci : 0;

      document.getElementById('md').textContent = md2;
      document.getElementById('cu').textContent = cu2;
      document.getElementById('sk').textContent = sk2;

      burst(el, CL[target.ci].hex);
      rp2(); rm(); dw();
      document.getElementById('svb').style.display = 'block';
    }

    // ── SAVE ──
    function saveAndExit() {
      var score = Math.round(pts.filter(p => p.filled).length / pts.length * 100) * 5 + md2 * 20;
      try {
        var r = GameEngine.saveScore('color_your_world', score);
        document.getElementById('lxp').textContent = r.totalXP + ' XP';
        ts('Score saved! +' + r.xpEarned + ' XP');
      } catch (e) { ts('Score: ' + score + ' pts'); }
      setTimeout(() => { try { window.location.href = 'manokart_games_hub.html'; } catch (e) { } }, 1600);
    }

    // ── INIT ──
    window.addEventListener('load', () => setTimeout(ip, 80));
    setTimeout(ip, 200);
    try { document.getElementById('lxp').textContent = GameEngine.getLevelInfo().totalXP + ' XP'; } catch (e) { }
    rp2(); rm();
  </script>
</body>

</html>
