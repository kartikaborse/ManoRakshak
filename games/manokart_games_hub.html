<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ManoKart — Wellness Games</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f0d;--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.08);
  --glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.1);
  --green:#4ade80;--green-dim:rgba(74,222,128,0.12);--green-dark:#166534;
  --teal:#5eead4;--teal-dim:rgba(94,234,212,0.1);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.1);
  --pink:#f472b6;--pink-dim:rgba(244,114,182,0.1);
  --text:#e8ede4;--text2:#9aaa90;--text3:#5a6b54;
  --radius:16px;--radius-sm:10px;
  --font-d:'DM Serif Display',serif;--font-b:'Outfit',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 15% 0%,rgba(74,222,128,0.06) 0%,transparent 70%),
  radial-gradient(ellipse 40% 40% at 85% 30%,rgba(94,234,212,0.05) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 50% 100%,rgba(167,139,250,0.04) 0%,transparent 60%);
  pointer-events:none}

.page{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 20px 80px}

/* ── Top Bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;flex-wrap:wrap;gap:12px}
.topbar-left{display:flex;align-items:center;gap:14px}
.back-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;text-decoration:none}
.back-btn:hover{background:var(--surface2);color:var(--text);border-color:rgba(255,255,255,.2)}
.topbar-title{font-family:var(--font-d);font-size:1.5rem;color:var(--green)}
.topbar-title span{color:var(--text);font-style:italic}

/* ── Player Card ── */
.player-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:20px;padding:24px;margin-bottom:28px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.player-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(74,222,128,.4),rgba(94,234,212,.4),transparent)}
.player-top{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.level-ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--xp-pct,0) * 1%),rgba(255,255,255,.08) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.level-inner{width:52px;height:52px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.level-num{font-family:var(--font-d);font-size:1.4rem;color:var(--green);line-height:1}
.level-label{font-size:.55rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.player-info{flex:1}
.player-name{font-size:1.1rem;font-weight:600}
.player-xp{font-size:.82rem;color:var(--text2);margin-top:2px}
.xp-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:8px}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--teal));border-radius:3px;transition:width .6s ease}
.xp-label{font-size:.7rem;color:var(--text3);margin-top:4px}
.stat-pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--surface2);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:80px}
.pill .pv{font-family:var(--font-d);font-size:1.3rem;color:var(--text)}
.pill .pl{font-size:.65rem;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}

/* ── Section Heads ── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 14px}
.sec-head h2{font-family:var(--font-d);font-size:1.25rem;color:var(--text)}
.sec-head span{font-size:.75rem;color:var(--text3)}

/* ── Game Cards ── */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.game-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;text-decoration:none;display:block;color:inherit}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--card-accent,.3),transparent);opacity:.5}
.game-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.gc-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.gc-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.gc-info{flex:1}
.gc-name{font-weight:600;font-size:.95rem}
.gc-desc{font-size:.75rem;color:var(--text2);margin-top:2px;line-height:1.4}
.gc-play{width:34px;height:34px;border-radius:50%;background:var(--green-dim);border:1px solid rgba(74,222,128,.3);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:.9rem;flex-shrink:0;transition:all .2s}
.game-card:hover .gc-play{background:var(--green);color:var(--bg)}
.gc-stats{display:flex;gap:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.gc-stat{font-size:.72rem;color:var(--text3)}
.gc-stat strong{color:var(--text2);font-weight:500}
.gc-best{margin-left:auto;font-size:.7rem;font-weight:600;color:var(--amber);background:var(--amber-dim);padding:2px 10px;border-radius:20px}

/* ── Badges ── */
.badges-grid{display:flex;flex-wrap:wrap;gap:10px}
.badge-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:8px 14px;transition:all .2s}
.badge-chip.earned{border-color:rgba(251,191,36,.35);background:var(--amber-dim)}
.badge-chip .bi{font-size:1.1rem}
.badge-chip .bn{font-size:.78rem;color:var(--text2);font-weight:500}
.badge-chip.earned .bn{color:var(--amber)}
.badge-chip .bd{font-size:.65rem;color:var(--text3)}

/* ── Recent Activity ── */
.activity-list{display:flex;flex-direction:column;gap:8px}
.activity-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:10px 14px}
.activity-icon{font-size:1.2rem}
.activity-info{flex:1}
.activity-game{font-size:.82rem;font-weight:500}
.activity-detail{font-size:.7rem;color:var(--text3)}
.activity-score{font-size:.85rem;font-weight:600;color:var(--green)}
.activity-time{font-size:.65rem;color:var(--text3)}
.empty-state{text-align:center;padding:28px;color:var(--text3);font-size:.9rem}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(10,20,12,.95);border:1px solid rgba(74,222,128,.3);color:var(--text);padding:10px 22px;border-radius:99px;font-size:.85rem;z-index:999;transition:transform .4s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(12px);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── Animations ── */
.fade-up{opacity:0;transform:translateY(20px);animation:fadeUp .5s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}

@media(max-width:600px){
  .games-grid{grid-template-columns:1fr}
  .stat-pills{flex-wrap:wrap}
  .pill{min-width:70px}
}
</style>
</head>
<body>

<div class="page">
  <div class="topbar fade-up d1">
    <div class="topbar-left">
      <a href="/" class="back-btn" title="Back to ManoKart Hub">←</a>
      <div class="topbar-title">🌿 <span>Wellness</span> Games</div>
    </div>
  </div>

  <!-- Player Card -->
  <div class="player-card fade-up d2" id="player-card">
    <div class="player-top">
      <div class="level-ring" id="level-ring">
        <div class="level-inner">
          <div class="level-num" id="pc-level">1</div>
          <div class="level-label">Level</div>
        </div>
      </div>
      <div class="player-info">
        <div class="player-name">ManoKart Player</div>
        <div class="player-xp" id="pc-xp-text">0 XP total</div>
        <div class="xp-bar"><div class="xp-fill" id="pc-xp-fill" style="width:0%"></div></div>
        <div class="xp-label" id="pc-xp-label">0 / 500 XP to next level</div>
      </div>
    </div>
    <div class="stat-pills">
      <div class="pill"><div class="pv" id="pc-games">0</div><div class="pl">Games Played</div></div>
      <div class="pill"><div class="pv" id="pc-streak">0</div><div class="pl">Day Streak</div></div>
      <div class="pill"><div class="pv" id="pc-badges">0/12</div><div class="pl">Badges</div></div>
      <div class="pill"><div class="pv" id="pc-best">0</div><div class="pl">Best Score</div></div>
    </div>
  </div>

  <!-- Games Grid -->
  <div class="sec-head fade-up d3"><h2>All Games</h2><span>7 wellness activities</span></div>
  <div class="games-grid fade-up d3" id="games-grid"></div>

  <!-- Badges -->
  <div class="sec-head fade-up d4"><h2>Badges</h2><span id="badge-count">0 / 12 earned</span></div>
  <div class="badges-grid fade-up d4" id="badges-grid"></div>

  <!-- Recent Activity -->
  <div class="sec-head fade-up d4"><h2>Recent Activity</h2></div>
  <div class="activity-list fade-up d4" id="activity-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="gameEngine.js"></script>
<script>
(function(){
  var GAME_CARDS = [
    { id:'body_breath_quest',   slug:'manokart_body_breath_quest',   color:'rgba(94,234,212,.15)', accent:'rgba(94,234,212,.5)', desc:'Defeat stress monsters with real breathing and movement exercises' },
    { id:'calm_grid_sudoku',    slug:'manokart_calm_grid_sudoku',    color:'rgba(74,222,128,.12)', accent:'rgba(74,222,128,.5)', desc:'A gentle, pressure-free Sudoku with soothing themes' },
    { id:'color_your_world',    slug:'manokart_color_your_world',    color:'rgba(244,114,182,.12)', accent:'rgba(244,114,182,.5)', desc:'Complete wellness moments to paint your canvas with color' },
    { id:'cozy_island_garden',  slug:'manokart_cozy_island_garden',  color:'rgba(251,191,36,.12)', accent:'rgba(251,191,36,.5)', desc:'Plant mood seeds, water them daily, and unlock island friends' },
    { id:'mood_blocks_tetris',  slug:'manokart_mood_blocks_tetris',  color:'rgba(167,139,250,.12)', accent:'rgba(167,139,250,.5)', desc:'Emotion-colored Tetris — clear rows to release stress' },
    { id:'spirit_journey',      slug:'manokart_spirit_journey',      color:'rgba(96,165,250,.12)', accent:'rgba(96,165,250,.5)', desc:'Guide emotional spirits through moonlit waters to peace' },
    { id:'stress_relief_ocean', slug:'manokart_stress_relief_ocean', color:'rgba(56,189,248,.12)', accent:'rgba(56,189,248,.5)', desc:'An animated ocean scene for mindful relaxation' },
  ];

  function fmt(ts){
    if(!ts) return '—';
    var d=new Date(ts);
    return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }

  function renderPlayer(){
    var s = GameEngine.getGlobalSummary();
    var li = GameEngine.getLevelInfo();
    document.getElementById('pc-level').textContent = s.level;
    document.getElementById('pc-xp-text').textContent = s.totalXP + ' XP total';
    document.getElementById('pc-xp-fill').style.width = s.xpProgressPct + '%';
    document.getElementById('pc-xp-label').textContent = li.xpInLevel + ' / ' + li.xpPerLevel + ' XP to next level';
    document.getElementById('level-ring').style.setProperty('--xp-pct', s.xpProgressPct);
    document.getElementById('pc-games').textContent = s.totalGamesPlayed;
    document.getElementById('pc-streak').textContent = s.currentStreak;
    document.getElementById('pc-badges').textContent = s.badgesEarned + '/' + s.totalBadges;
    var allBest = 0;
    s.games.forEach(function(g){ if(g.bestScore > allBest) allBest = g.bestScore; });
    document.getElementById('pc-best').textContent = allBest;
  }

  function renderGames(){
    var s = GameEngine.getGlobalSummary();
    var el = document.getElementById('games-grid');
    el.innerHTML = '';
    GAME_CARDS.forEach(function(card){
      var gameData = null;
      s.games.forEach(function(g){ if(g.id === card.id) gameData = g; });
      if(!gameData) return;
      var a = document.createElement('a');
      a.className = 'game-card';
      a.href = card.slug + '.html';
      a.style.setProperty('--card-accent', card.accent);
      a.innerHTML =
        '<div class="gc-top">' +
          '<div class="gc-icon" style="background:'+card.color+'">' + gameData.icon + '</div>' +
          '<div class="gc-info">' +
            '<div class="gc-name">' + gameData.name + '</div>' +
            '<div class="gc-desc">' + card.desc + '</div>' +
          '</div>' +
          '<div class="gc-play">▶</div>' +
        '</div>' +
        '<div class="gc-stats">' +
          '<div class="gc-stat">Played: <strong>' + gameData.timesPlayed + '</strong></div>' +
          '<div class="gc-stat">Last: <strong>' + fmt(gameData.lastPlayed) + '</strong></div>' +
          (gameData.bestScore > 0 ? '<div class="gc-best">Best: ' + gameData.bestScore + '</div>' : '') +
        '</div>';
      el.appendChild(a);
    });
  }

  function renderBadges(){
    var player = GameEngine.getPlayer();
    var earned = player.earnedBadges;
    var el = document.getElementById('badges-grid');
    el.innerHTML = '';
    GameEngine.BADGES.forEach(function(b){
      var isEarned = earned.indexOf(b.id) !== -1;
      var div = document.createElement('div');
      div.className = 'badge-chip' + (isEarned ? ' earned' : '');
      div.title = b.desc;
      div.innerHTML =
        '<span class="bi">' + (isEarned ? b.icon : '🔒') + '</span>' +
        '<div><div class="bn">' + b.name + '</div><div class="bd">' + b.desc + '</div></div>';
      el.appendChild(div);
    });
    document.getElementById('badge-count').textContent = earned.length + ' / ' + GameEngine.BADGES.length + ' earned';
  }

  function renderActivity(){
    var s = GameEngine.getGlobalSummary();
    var all = [];
    s.games.forEach(function(g){
      var stats = GameEngine.getGameStats(g.id);
      if(stats && stats.history){
        stats.history.forEach(function(h){
          all.push({ icon: g.icon, name: g.name, score: h.score, xp: h.xpEarned, time: h.timestamp });
        });
      }
    });
    all.sort(function(a,b){ return b.time - a.time; });
    all = all.slice(0, 8);
    var el = document.getElementById('activity-list');
    if(all.length === 0){
      el.innerHTML = '<div class="empty-state">🎮 No games played yet. Pick a game above and start your wellness journey!</div>';
      return;
    }
    el.innerHTML = '';
    all.forEach(function(a){
      var div = document.createElement('div');
      div.className = 'activity-row';
      div.innerHTML =
        '<div class="activity-icon">' + a.icon + '</div>' +
        '<div class="activity-info"><div class="activity-game">' + a.name + '</div><div class="activity-detail">+' + a.xp + ' XP earned</div></div>' +
        '<div class="activity-score">' + a.score + '</div>' +
        '<div class="activity-time">' + fmt(a.time) + '</div>';
      el.appendChild(div);
    });
  }

  renderPlayer();
  renderGames();
  renderBadges();
  renderActivity();

  window.addEventListener('gameEngineSynced', function () {
    renderPlayer();
    renderGames();
    renderBadges();
    renderActivity();
  });
})();
</script>
</body>
</html>
