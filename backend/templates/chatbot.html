<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ManoRakshak.AI — Chat</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#f7fdf9,#fdf4f8);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .chat-wrap{width:100%;max-width:640px;background:white;border-radius:20px;border:.5px solid #E1F5EE;box-shadow:0 4px 32px rgba(93,202,165,.08);display:flex;flex-direction:column;height:80vh}
    .chat-header{padding:20px 24px;border-bottom:.5px solid #E1F5EE;display:flex;align-items:center;gap:12px}
    .chat-header h1{font-size:1.1rem;color:#0F6E56}
    .chat-header p{font-size:.8rem;color:#5DCAA5;font-style:italic}
    .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:.9rem;line-height:1.55}
    .msg.bot{background:#E1F5EE;color:#0F6E56;border-radius:4px 16px 16px 16px;align-self:flex-start}
    .msg.user{background:#0F6E56;color:white;border-radius:16px 4px 16px 16px;align-self:flex-end}
    .input-row{padding:16px 20px;border-top:.5px solid #E1F5EE;display:flex;gap:10px}
    .input-row input{flex:1;padding:10px 16px;border-radius:99px;border:1.5px solid #D3D1C7;font-size:.9rem;outline:none;font-family:inherit}
    .input-row input:focus{border-color:#5DCAA5}
    .input-row button{padding:10px 20px;border-radius:99px;border:none;background:#0F6E56;color:white;font-size:.9rem;cursor:pointer;font-family:inherit}
    .input-row button:hover{background:#5DCAA5}
    .back{display:inline-block;margin-bottom:16px;color:#5DCAA5;text-decoration:none;font-size:.9rem}
    .back:hover{color:#0F6E56}
    .typing{opacity:.5;font-style:italic}
    @media(max-width: 600px) {
      body {
        padding: 10px;
      }
      .chat-wrap {
        height: calc(100vh - 60px);
        max-width: 100%;
        border-radius: 14px;
      }
      .back {
        align-self: flex-start;
        margin-left: 10px;
        margin-bottom: 8px;
      }
    }
  </style>
  <script>
    (function() {
      function checkAuth() {
        fetch('/api/auth/me')
          .then(res => {
            if (res.status === 401) {
              window.location.href = '/auth';
            }
          })
          .catch(() => {});
      }
      checkAuth();
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>

<style>
.inline-icon {
  display: inline-block;
  vertical-align: -0.15em;
  width: 1.1em;
  height: 1.1em;
  stroke: currentColor;
  fill: none;
}
</style>

</head>
<body>
  <a href="/" class="back">← Back to hub</a>
  <div class="chat-wrap">
    <div class="chat-header">
      <div style="font-size:2rem"><svg class="inline-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div>
      <div>
        <h1>ManoRakshak.AI Companion</h1>
        <p>I'm here to listen, always <svg class="inline-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></p>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">Hello <svg class="inline-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2a4 4 0 0 0-4 4c0 1.5.8 2.8 2 3.5-1.2.7-2 2-2 3.5a4 4 0 0 0 8 0c0-1.5-.8-2.8-2-3.5 1.2-.7 2-2 2-3.5a4 4 0 0 0-4-4z"/></svg> I'm your ManoRakshak.AI companion. How are you feeling today?</div>
    </div>
    <div class="input-row">
      <input id="inp" type="text" placeholder="Share what's on your mind..." onkeydown="if(event.key==='Enter')send()"/>
      <button onclick="send()">Send</button>
    </div>
  </div>
  <script>
    const msgs = document.getElementById('messages');
    const inp  = document.getElementById('inp');
    function addMsg(text, role) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      d.textContent = text;
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
      return d;
    }
    async function send() {
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      addMsg(text, 'user');
      const thinking = addMsg('Thinking...', 'bot typing');
      try {
        const res = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
        if (res.status === 401) {
          thinking.textContent = 'Session expired — redirecting to login...';
          thinking.classList.remove('typing');
          setTimeout(() => window.location.href = '/auth', 1500);
          return;
        }
        let data;
        try { data = await res.json(); } catch { data = {}; }
        if (data.reply) {
          thinking.textContent = data.reply;
        } else if (data.error) {
          thinking.textContent = data.error + ' <svg class="inline-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>️';
        } else {
          thinking.textContent = 'Something went wrong — please try again <svg class="inline-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>️';
        }
        thinking.classList.remove('typing');
      } catch(e) {
        thinking.textContent = 'Could not reach the server. Is it running? <svg class="inline-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>';
        thinking.classList.remove('typing');
      }
    }
  </script>
</body>
</html>
