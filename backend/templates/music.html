<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ManoRakshak — Mood Music</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --sage:#0F6E56;--sage-mid:#1D9E75;--sage-light:#5DCAA5;
      --sage-pale:#9FE1CB;--sage-ghost:#E1F5EE;
      --warm-white:#f9f8f4;--ink:#2C2C2A;--muted:#5F5E5A;--hint:#B4B2A9;
      --card-border:rgba(93,202,165,.18);
    }
    body{font-family:'Outfit',sans-serif;background:var(--warm-white);color:var(--ink);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 60% at 10% 0%,rgba(147,130,220,.13) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 90% 20%,rgba(253,244,248,.9) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 50% 100%,rgba(255,251,242,.8) 0%,transparent 60%);pointer-events:none}
    .orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.3;z-index:0;animation:drift 12s ease-in-out infinite alternate}
    .orb1{width:300px;height:300px;background:#c4b5fd;top:-60px;left:-60px}
    .orb2{width:220px;height:220px;background:#f4c0d1;top:40%;right:-50px;animation-delay:-4s}
    .orb3{width:180px;height:180px;background:#fac775;bottom:10%;left:25%;animation-delay:-8s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.08)}}
    .page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 28px 80px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0;flex-wrap:wrap;gap:10px}
    .logo{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--sage);letter-spacing:-.5px;display:flex;align-items:center;gap:10px;text-decoration:none}
    .back{color:var(--sage-light);text-decoration:none;font-size:.9rem;transition:color .2s}
    .back:hover{color:var(--sage)}
    h1.page-title{font-family:'DM Serif Display',serif;font-size:2.2rem;color:var(--ink);letter-spacing:-1px;margin:32px 0 6px}
    h1.page-title em{color:#7C3AED;font-style:italic}
    .page-sub{font-size:1rem;color:var(--muted);font-weight:300;margin-bottom:32px}
    /* Mood selector */
    .mood-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
    .mood-btn{padding:10px 20px;border-radius:99px;border:1.5px solid var(--card-border);background:rgba(255,255,255,.7);color:var(--muted);font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .22s;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px}
    .mood-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.06)}
    .mood-btn.active{background:linear-gradient(135deg,#7C3AED,#a78bfa);color:white;border-color:#7C3AED;box-shadow:0 4px 20px rgba(124,58,237,.25)}
    .mood-btn .emoji{font-size:1.2rem}
    /* Language selector */
    .lang-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1.5px solid rgba(93,202,165,.12);padding-bottom:16px}
    .lang-btn{padding:8px 18px;border-radius:99px;border:1.5px solid var(--card-border);background:rgba(255,255,255,.6);color:var(--muted);font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .22s;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px}
    .lang-btn:hover{transform:translateY(-1.5px);box-shadow:0 4px 12px rgba(0,0,0,.04)}
    .lang-btn.active{background:linear-gradient(135deg,#0F6E56,#1D9E75);color:white;border-color:#0F6E56;box-shadow:0 4px 15px rgba(15,110,86,.2)}
    /* Playlist section */
    .section-label{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--ink);margin:28px 0 16px;letter-spacing:-.3px}
    .playlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
    .playlist-card{background:rgba(255,255,255,.8);border:1px solid var(--card-border);border-radius:20px;padding:20px;backdrop-filter:blur(8px);transition:all .22s;cursor:pointer;position:relative;overflow:hidden}
    .playlist-card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(124,58,237,.1);border-color:rgba(124,58,237,.3)}
    .playlist-card h3{font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:4px}
    .playlist-card p{font-size:.82rem;color:var(--hint);line-height:1.5;margin-bottom:12px}
    .playlist-card .platform-tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
    .platform-tag.spotify{background:rgba(30,215,96,.12);color:#1DB954}
    .platform-tag.youtube{background:rgba(255,0,0,.08);color:#FF0000}
    .embed-wrap{border-radius:12px;overflow:hidden;margin-top:12px;background:#f0f0f0;min-height:80px}
    .embed-wrap iframe{width:100%;border:none;border-radius:12px}
    .yt-links{display:flex;flex-direction:column;gap:10px;margin-top:8px}
    .yt-link{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;border:1px solid var(--card-border);background:rgba(255,255,255,.7);text-decoration:none;color:var(--ink);transition:all .2s;font-size:.9rem}
    .yt-link:hover{background:rgba(255,0,0,.04);border-color:rgba(255,0,0,.2);transform:translateX(4px)}
    .yt-link .yt-icon{font-size:1.4rem;flex-shrink:0}
    .yt-link .yt-title{font-weight:500}
    .yt-link .yt-desc{font-size:.78rem;color:var(--hint)}
    .auto-detect{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:99px;padding:8px 18px;font-size:.82rem;color:#7C3AED;font-weight:500;margin-bottom:20px;animation:fadeUp .5s ease}
    .auto-detect .pulse{width:8px;height:8px;background:#7C3AED;border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .5s ease}
    footer{text-align:center;padding:40px 0 20px;font-size:.8rem;color:var(--hint)}
    footer span{color:var(--sage-light)}
    @media(max-width:768px){
      .page{padding:0 16px 60px}
      .topbar{flex-direction:column;align-items:flex-start;gap:12px;padding:20px 0 0}
      .topbar > div{width:100%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
      .mood-grid{width:100%;overflow-x:auto;white-space:nowrap;display:flex;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
      .mood-grid::-webkit-scrollbar{display:none}
      .mood-btn{flex-shrink:0}
      .playlist-grid{grid-template-columns:1fr;gap:12px}
    }
  </style>
  <script>
    (function() {
      function checkAuth() {
        fetch('/api/auth/me')
          .then(res => {
            if (res.status === 401) {
              window.location.href = '/auth';
            }
          })
          .catch(() => {});
      }
      checkAuth();
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>

let currentMood = null;
let currentLang = 'all';

// Build mood buttons
const grid = document.getElementById('mood-grid');
MOODS.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'mood-btn';
  btn.id = 'mood-' + m.key;
  btn.innerHTML = `<span class="emoji">${m.emoji}</span> ${m.label}`;
  btn.onclick = () => selectMood(m.key);
  grid.appendChild(btn);
});

function selectMood(key) {
  currentMood = key;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('mood-' + key);
  if (btn) btn.classList.add('active');
  renderPlaylists(key);
}

function selectLanguage(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById('lang-' + lang);
  if (activeBtn) activeBtn.classList.add('active');
  if (currentMood) renderPlaylists(currentMood);
}

function renderPlaylists(mood) {
  const data = PLAYLISTS[mood];
  if (!data) return;
  const container = document.getElementById('playlist-content');

  // Filter based on selected language
  const filteredSpotify = data.spotify.filter(pl => currentLang === 'all' || pl.lang === currentLang);
  const filteredYoutube = data.youtube.filter(yt => currentLang === 'all' || yt.lang === currentLang);

  let html = '';

  if (filteredSpotify.length > 0) {
    html += `<h2 class="section-label fade-up">🎧 ${data.title}</h2>`;
    html += '<div class="playlist-grid fade-up">';
    filteredSpotify.forEach(pl => {
      html += `
        <div class="playlist-card">
          <span class="platform-tag spotify">🟢 Spotify</span>
          <h3>${pl.name}</h3>
          <p>${pl.desc}</p>
          <div class="embed-wrap">
            <iframe src="https://open.spotify.com/embed/playlist/${pl.uri}?theme=0" height="${pl.height}" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  if (filteredYoutube.length > 0) {
    html += '<h2 class="section-label fade-up">▶️ YouTube Music</h2>';
    html += '<div class="yt-links fade-up">';
    filteredYoutube.forEach(yt => {
      html += `
        <a class="yt-link" href="${yt.url}" target="_blank" rel="noopener">
          <span class="yt-icon">▶️</span>
          <div>
            <div class="yt-title">${yt.title}</div>
            <div class="yt-desc">${yt.desc}</div>
          </div>
        </a>`;
    });
    html += '</div>';
  }

  if (filteredSpotify.length === 0 && filteredYoutube.length === 0) {
    html += `
      <div class="fade-up" style="color:var(--muted); font-size:0.95rem; margin-top:20px; text-align:center; padding:40px; border-radius:20px; border:1px dashed var(--card-border); background:rgba(255,255,255,0.4);">
        No playlists available in the selected language for this mood. Try switching the language filter! 🎵
      </div>`;
  }

  container.innerHTML = html;
}

// Auto-detect mood from diary/analytics
fetch('/api/analytics')
  .then(r => r.json())
  .then(d => {
    const moodMap = {1:'anxious', 2:'sad', 3:'calm', 4:'happy', 5:'happy'};
    if (d.avg_mood) {
      const detected = moodMap[Math.round(d.avg_mood)] || 'neutral';
      const banner = document.getElementById('auto-detect-banner');
      const moodObj = MOODS.find(m => m.key === detected);
      banner.innerHTML = `<div class="auto-detect"><span class="pulse"></span> Detected mood from your diary: ${moodObj ? moodObj.emoji : ''} <strong>${detected}</strong></div>`;
      selectMood(detected);
    } else {
      selectMood('calm');
    }
  })
  .catch(() => selectMood('calm'));
</script>
